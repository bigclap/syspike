[package]
name = "core_graph"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
candle-core = { git = "https://github.com/huggingface/candle.git" }
bincode = "1.3.3"
thiserror = "1.0"

[dev-dependencies]
rstest = "0.21.0"
serde_json = "1.0"
tempfile = "3.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
approx = "0.5.1"
